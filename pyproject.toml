[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-optimizer"
version = "0.1.0"
description = "Last-mile delivery route optimizer: OR-Tools CVRP vs the classic Clarke-Wright savings heuristic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Dimitres Kisimov" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["routeopt*"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
