name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ortools numpy matplotlib pandas ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Regenerate instances (reproducible)
        run: python data/generate_instances.py

      - name: Tests
        run: pytest -q

      - name: Smoke — solve + compare + write deliverables
        run: python -m routeopt --instance data/instances/n30.json --compare --time-limit 3

      - name: Build web dashboard data
        run: python web/build_data.py --instance data/instances/n30.json --time-limit 3

      - name: Assert deliverables exist and parse
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          required = [
              "deliverables/route_plan.csv",
              "deliverables/routes.png",
              "deliverables/summary.md",
              "web/data.js",
          ]
          missing = [p for p in required if not Path(p).exists()]
          assert not missing, f"missing deliverables: {missing}"

          rows = list(csv.DictReader(open("deliverables/route_plan.csv", encoding="utf-8")))
          assert rows, "route_plan.csv is empty"
          assert {"vehicle", "stop_order", "node", "load_after_stop"} <= set(rows[0]), "unexpected CSV header"
          assert "route-optimizer" in Path("web/data.js").read_text(encoding="utf-8") or "ROUTEOPT" in Path("web/data.js").read_text(encoding="utf-8")
          print(f"OK — {len(rows)} plan rows, all deliverables present")
          PY
